# Telebit (fcitx5) — point the graphical session's IM plumbing at fcitx5.
#
# Read by systemd-environment-d-generator(8) when the user's service manager
# starts, so these land in GNOME/KDE and in everything they spawn. Flatpak apps
# pick them up for free: flatpak inherits the launcher's whole environment and
# its blacklist (PATH, LD_*, XDG_*_DIRS, TMP*, GST_*, ...) contains no IM
# variable. That is deliberately *not* done with `flatpak override` — a root
# postinst can only write /var/lib/flatpak/overrides/global, and flatpak skips
# system overrides entirely for `--user`-installed apps, which is how most
# people install Flatpaks.
#
# Numbered 60 so 99-environment.conf (which replays /etc/environment) still
# sorts later and wins — see environment.d(5) on lexicographic ordering.
#
# To disable this file, the local admin masks it the systemd way:
#   sudo ln -s /dev/null /etc/environment.d/60-telebit-fcitx5.conf
#
# Either way, changes only apply to the next login.

GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
